<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Down Indicator</title>
    <style>
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .scroll-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .mouse {
            width: 26px;
            height: 44px;
            border: 2px solid #ffffff;
            border-radius: 20px;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .dot {
            width: 4px;
            height: 4px;
            background-color: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            animation: scroll-dot 2s infinite cubic-bezier(0.65, 0, 0.35, 1);
        }

        @keyframes scroll-dot {
            0% {
                opacity: 0;
                transform: translateY(0);
            }
            20% {
                opacity: 1;
                transform: translateY(0);
            }
            80% {
                opacity: 1;
                transform: translateY(20px);
            }
            100% {
                opacity: 0;
                transform: translateY(20px);
            }
        }

        .text {
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="scroll-container">
        <div class="mouse">
            <div class="dot"></div>
        </div>
        <div class="text">Scroll Down</div>
    </div>
</body>
</html>
